# PocketSlice – run with:  docker compose up -d --build
# Copy .env.example to .env first and set MOONRAKER_URL / APP_PASSWORD.
services:
  pocketslice:
    build: .
    image: pocketslice:latest
    container_name: pocketslice
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      MOONRAKER_URL: ${MOONRAKER_URL:-http://voron.local:7125}
      MOONRAKER_API_KEY: ${MOONRAKER_API_KEY:-}
      PRINTER_NAME: ${PRINTER_NAME:-Voron}
      WEBCAM_STREAM_URL: ${WEBCAM_STREAM_URL:-}
      WEBCAM_SNAPSHOT_URL: ${WEBCAM_SNAPSHOT_URL:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      SLICE_TIMEOUT: ${SLICE_TIMEOUT:-1800}
    volumes:
      # Your OrcaSlicer config folder (user/ + system/ + OrcaSlicer.conf) goes here.
      - ./profiles:/profiles
      - pocketslice-data:/data
    # Uncomment if the container cannot resolve voron.local (mDNS) – use the IP instead
    # extra_hosts:
    #   - "voron.local:192.168.1.50"

volumes:
  pocketslice-data:
